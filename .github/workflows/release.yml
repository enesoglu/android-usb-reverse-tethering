name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate requested tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          $tag=if($env:INPUT_TAG){$env:INPUT_TAG}else{$env:REF_TAG}
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') {throw 'Only version tags may publish releases'}
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare Android SDK
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          1..50 | ForEach-Object {'y'} | & $sdkmanager --licenses | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'SDK license preparation failed'}
          & $sdkmanager 'platforms;android-36' 'build-tools;37.0.0'
          if ($LASTEXITCODE -ne 0) {throw 'SDK package setup failed'}
      - name: Validate version and run checks before loading signing secrets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version=Get-Content -Raw version.json | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne ('v'+$version.version)) {throw 'Tag does not match version.json'}
          python scripts/check-publication.py
          if ($LASTEXITCODE -ne 0) {throw 'Publication checks failed'}
          ./check.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME
          ./scripts/Install-InnoSetup.ps1
      - name: Restore Android release key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {throw 'ANDROID_KEYSTORE_BASE64 secret is missing'}
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'usb-relay-release.jks'),[Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: Build and verify release packages
        shell: pwsh
        env:
          USB_RELAY_KEYSTORE: ${{ runner.temp }}/usb-relay-release.jks
          USB_RELAY_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:USB_RELAY_SIGNING_PASSWORD) {throw 'Signing password secret is missing'}
          ./scripts/Build-Release.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME
          ./scripts/Test-ReleasePackage.ps1
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $key=Join-Path $env:RUNNER_TEMP 'usb-relay-release.jks'
          if (Test-Path -LiteralPath $key) {Remove-Item -LiteralPath $key -Force}
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/artifacts/*
      - name: Publish alpha release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $files=@(Get-ChildItem build/release/artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --prerelease --title "USB Relay $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) {throw 'GitHub release publication failed'}
